name: VAIB Bootstrap Public IDs

on:
  push:
    branches:
      - vaib/fix-all-group-public-id

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run bootstrap public ID regression
        run: go test ./management/server/types -run '^TestAddAllGroup_AssignsPublicIDs$' -count=1 -v
