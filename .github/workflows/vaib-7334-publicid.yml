name: VAIB 7334 PublicID Gap

on:
  push:
    branches:
      - vaib/repro-7334-v0771

jobs:
  repro:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prove AddAllGroup leaves PublicID empty
        run: go test ./management/server/types -run '^TestVAIB7334_AddAllGroupLeavesPublicIDEmpty$' -count=1 -v
